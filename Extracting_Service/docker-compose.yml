version: '3.8'

services:
  s3-eml-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: s3-eml-processor
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      # Persistent logs directory
      - ./logs:/app/logs

      # Crontab file (editable on server)
      - ./crontab:/app/crontab:ro

      # Optional: Uncomment to persist data locally
      - ./data:/app/data

    # Health check configuration
    healthcheck:
      test: ['CMD', 'pgrep', 'cron']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
